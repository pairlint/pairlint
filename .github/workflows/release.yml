name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package versions
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:dist
      - run: node scripts/prepare-packages.mjs
      # Trusted publishing: npm exchanges this job's OIDC token for a short-lived publish token
      # and attaches a provenance attestation. No npm token is stored in this repository.
      - run: npm publish --workspaces --access public

  github-release:
    name: GitHub release with SBOMs
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # CycloneDX SBOMs of what each published package installs. Dev tools are left out because
      # they never reach users.
      - name: Write SBOMs
        run: |
          mkdir sbom
          for workspace in pairlint @pairlint/contrast @pairlint/tokens-core; do
            file="sbom/${workspace//\//-}.cdx.json"
            file="${file//@/}"
            npm sbom --sbom-format cyclonedx --omit dev --workspace "$workspace" > "$file"
          done
          ls sbom
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes sbom/*.cdx.json
