name: Bug report
description: Something pairlint got wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: tokens
    attributes:
      label: Smallest config and tokens that show it
      description: A few tokens are usually enough.
      render: jsonc
  - type: input
    id: version
    attributes:
      label: pairlint version
      placeholder: "pairlint --version"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node version and OS
      placeholder: "Node 22.14, macOS 15"
