<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing loads from anywhere: no network, no fonts, no images from outside the panel. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<title>pairlint</title>
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-alt: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --muted: var(--figma-color-text-secondary, #5c5c5c);
    --border: var(--figma-color-border, #c4c4c4);
    --danger: var(--figma-color-text-danger, #b3261e);
    --success: var(--figma-color-text-success, #1a7f37);
    --accent: var(--figma-color-bg-brand, #0b63ce);
    --on-accent: var(--figma-color-text-onbrand, #ffffff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 13px; margin: 0 0 4px; }
  h2 { font-size: 12px; margin: 16px 0 6px; }
  p { margin: 0 0 6px; }
  #status { color: var(--muted); white-space: pre-line; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details { margin: 10px 0; }
  summary { cursor: pointer; font-weight: 600; }
  textarea { width: 100%; min-height: 180px; margin-top: 6px; padding: 8px; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px; resize: vertical; }
  .headline { font-size: 14px; font-weight: 600; margin-top: 8px; }
  .headline.ok { color: var(--success); }
  .headline.bad { color: var(--danger); }
  .meta, .detail, .more, .warning { color: var(--muted); }
  .results { list-style: none; margin: 0; padding: 0; }
  .results li { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .pair { font-weight: 600; overflow-wrap: anywhere; }
  .fix { overflow-wrap: anywhere; }
  .sample { flex: none; width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .error .detail { color: var(--danger); }
</style>
</head>
<body>
<h1>pairlint</h1>
<p id="status">Reading color variables…</p>
<div class="actions">
  <button type="button" id="check" class="primary">Check again</button>
  <button type="button" id="refresh">Reload variables</button>
</div>
<details>
  <summary>Pairs to check</summary>
  <label for="config" class="meta">Edit the pairs, then choose Check again. This is the same pairlint.config.json the command line reads.</label>
  <textarea id="config" spellcheck="false"></textarea>
</details>
<main id="results" aria-live="polite"></main>
<h2>Use it in your repository</h2>
<p class="meta">Save both files next to each other and run <code>npx pairlint</code>. CI then checks the same pairs you see here.</p>
<div class="actions">
  <button type="button" id="save-tokens">Save figma-variables.json</button>
  <button type="button" id="save-config">Save pairlint.config.json</button>
  <button type="button" id="copy-tokens">Copy tokens</button>
  <button type="button" id="copy-config">Copy config</button>
</div>
<!-- script -->
</body>
</html>
